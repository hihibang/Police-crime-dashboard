    const sum = obj => Object.values(obj).reduce((a, b) => a + b, 0);
    const top5 = obj => Object.entries(obj).sort((a, b) => b[1] - a[1]).slice(0, 5);
    const isForeign = name => name.startsWith('외국 ');

    // 선택한 범죄 유형(또는 전체)의 시간대 · 장소 · 지역 집계
    function aggregate(selected) {
      const names = selected === ALL ? Object.keys(fullCrimeData) : [selected];
      const time = new Array(8).fill(0);
      const place = {};
      const region = {};
      names.forEach(name => {
        const d = fullCrimeData[name];
        d.t.forEach((v, i) => { time[i] += v; });
        Object.entries(d.p).forEach(([k, v]) => {
          if (!PLACE_EXCLUDE.includes(k)) place[k] = (place[k] || 0) + v;
        });
        Object.entries(d.r).forEach(([k, v]) => {
          if (!isForeign(k)) region[k] = (region[k] || 0) + v;
        });
      });
      const timeTotal = time.reduce((s, v) => s + v, 0);
      const placeTotal = sum(place);
      const regionTotal = sum(region);
      const placeTop = top5(place);
      const regionTop = top5(region);
      const peak = time.indexOf(Math.max(...time));
      return {
        label: selected === ALL ? '전체 범죄' : selected,
        time, timeTotal, peak,
        placeTop, placeTotal,
        regionTop, regionTotal
      };
    }

    /* ===================== KPI ===================== */
    function renderKpis(a) {
      const top1Place = a.placeTop[0] || ['-', 0];
      const top1Region = a.regionTop[0] || ['-', 0];
      const cards = [
        { title: '총 발생 건수 (시간대 합계)', value: fmt(a.timeTotal) + '건', sub: a.label, color: 'text-cyan-300' },
        { title: '최다 발생 시간대', value: TIME_LABELS[a.peak] + '시', sub: `전체의 ${pct(a.time[a.peak], a.timeTotal)}%`, color: 'text-cyan-300' },
        { title: '최다 발생 장소 (1위)', value: top1Place[0].replace(/_/g, '·'), sub: `장소 합계의 ${pct(top1Place[1], a.placeTotal)}%`, color: 'text-emerald-300' },
        { title: '최다 발생 지역 (1위)', value: top1Region[0], sub: `지역 합계의 ${pct(top1Region[1], a.regionTotal)}%`, color: 'text-amber-300' }
      ];
      document.getElementById('kpis').innerHTML = cards.map(c => `
      <div class="panel px-4 py-3">
        <p class="text-xs text-slate-400">${c.title}</p>
        <p class="kpi-value mt-1 truncate text-xl font-bold ${c.color}" title="${c.value}">${c.value}</p>
        <p class="mt-0.5 truncate text-[11px] text-slate-500">${c.sub}</p>
      </div>`).join('');
    }

    /* ===================== 인사이트 ===================== */
    const NIGHT_SLOTS = [0, 6, 7]; // 00-02, 18-20, 21-23

    function renderInsight(a) {
      const isNight = NIGHT_SLOTS.includes(a.peak);
      const [p1, p1v] = a.placeTop[0] || ['-', 0];
      const [r1, r1v] = a.regionTop[0] || ['-', 0];
      const placeShare5 = pct(a.placeTop.reduce((s, [, v]) => s + v, 0), a.placeTotal);
      const regionShare5 = pct(a.regionTop.reduce((s, [, v]) => s + v, 0), a.regionTotal);
      const placeName = p1.replace(/_/g, '·');
      const lines = [
        `<b class="text-cyan-300">시간대:</b> 가장 많이 발생한 시간대는 <b>${TIME_LABELS[a.peak]}시</b>(${pct(a.time[a.peak], a.timeTotal)}%)이며, ${isNight ? '저녁·심야 시간대에 발생이 몰리는 야간형 패턴' : '주간 시간대에 발생이 집중되는 주간형 패턴'}입니다.`,
        `<b class="text-emerald-300">장소:</b> 1위는 <b>${placeName}</b>(${pct(p1v, a.placeTotal)}%)이며, 상위 5개 장소가 전체의 ${placeShare5}%를 차지합니다.`,
        `<b class="text-amber-300">지역:</b> 1위는 <b>${r1}</b>(${pct(r1v, a.regionTotal)}%)이며, 상위 5개 지역이 전체의 ${regionShare5}%를 차지합니다.`,
        `<b class="text-rose-300">결합 연관성:</b> ${isNight
          ? `야간 시간대와 <b>${placeName}</b>의 조합은 사람의 통행이 줄고 접근이 쉬운 생활·유흥 공간에서 범행 위험이 커지는 상황을 시사합니다.`
          : `주간 시간대와 <b>${placeName}</b>의 조합은 유동인구가 많은 상업·업무·교통 공간에서의 발생 가능성을 시사합니다.`
        } 지역 측면에서는 <b>${r1}</b>처럼 인구·상권 밀집 지역에 발생이 누적되는 경향이 확인됩니다.`
      ];
      document.getElementById('insight').innerHTML = lines.map(l => `<li>• ${l}</li>`).join('');
    }

    /* ===================== 차트 ===================== */
    Chart.defaults.color = COLORS.tick;
    Chart.defaults.font.family = "'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif";
    Chart.defaults.font.size = 11;

    const tooltipStyle = {
      backgroundColor: '#0f172a', borderColor: '#334155', borderWidth: 1,
      titleColor: '#f1f5f9', bodyColor: '#e2e8f0', padding: 10, displayColors: false
    };
    const layoutPadding = { top: 10, right: 18, bottom: 6, left: 6 };
    const axisGrid = { color: COLORS.grid };
    const compact = new Intl.NumberFormat('ko-KR', { notation: 'compact' });

    function createCharts() {
      const timeChart = new Chart(document.getElementById('timeChart'), {
        type: 'line',
        data: {
          labels: TIME_LABELS,
          datasets: [{
            label: '발생 건수', data: [], borderColor: COLORS.time,
            backgroundColor: 'rgba(34, 211, 238, 0.15)', fill: true, tension: 0.35,
            pointRadius: 4, pointHoverRadius: 6, pointBackgroundColor: COLORS.time, borderWidth: 2
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false, layout: { padding: layoutPadding },
          plugins: { legend: { display: false }, tooltip: { ...tooltipStyle, callbacks: { label: c => ' ' + fmt(c.parsed.y) + '건' } } },
          scales: {
            x: { grid: axisGrid, title: { display: true, text: '시간대(시)', color: COLORS.tick } },
            y: { grid: axisGrid, beginAtZero: true, ticks: { callback: v => compact.format(v), maxTicksLimit: 6 } }
          }
        }
      });

      const placeChart = new Chart(document.getElementById('placeChart'), {
        type: 'bar',
        data: { labels: [], datasets: [{ label: '발생 건수', data: [], backgroundColor: 'rgba(52, 211, 153, 0.75)', borderRadius: 6, barThickness: 22 }] },
        options: {
          indexAxis: 'y', responsive: true, maintainAspectRatio: false, layout: { padding: layoutPadding },
          plugins: { legend: { display: false }, tooltip: { ...tooltipStyle, callbacks: { label: c => ' ' + fmt(c.parsed.x) + '건' } } },
          scales: {
            x: { grid: axisGrid, beginAtZero: true, ticks: { callback: v => compact.format(v), maxTicksLimit: 5 } },
            y: { grid: { display: false }, ticks: { color: '#e2e8f0' } }
          }
        }
      });

      const regionChart = new Chart(document.getElementById('regionChart'), {
        type: 'bar',
        data: { labels: [], datasets: [{ label: '발생 건수', data: [], backgroundColor: 'rgba(251, 191, 36, 0.8)', borderRadius: 6, maxBarThickness: 46 }] },
        options: {
          responsive: true, maintainAspectRatio: false, layout: { padding: layoutPadding },
          plugins: { legend: { display: false }, tooltip: { ...tooltipStyle, callbacks: { label: c => ' ' + fmt(c.parsed.y) + '건' } } },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#e2e8f0', autoSkip: false, maxRotation: 0 } },
            y: { grid: axisGrid, beginAtZero: true, ticks: { callback: v => compact.format(v), maxTicksLimit: 6 } }
          }
        }
      });

      return { timeChart, placeChart, regionChart };
    }

    function updateCharts(charts, a) {
      const { timeChart, placeChart, regionChart } = charts;

      // 시간대: 최다 시간대 포인트 강조
      timeChart.data.datasets[0].data = a.time;
      timeChart.data.datasets[0].pointRadius = a.time.map((_, i) => (i === a.peak ? 7 : 4));
      timeChart.data.datasets[0].pointBackgroundColor = a.time.map((_, i) => (i === a.peak ? '#fbbf24' : COLORS.time));
      timeChart.update();

      // 장소 Top 5 (가로 막대) - 복합 장소명은 줄바꿈하여 좌측 라벨 잘림 방지
      placeChart.data.labels = a.placeTop.map(([k]) => k.split('_'));
      placeChart.data.datasets[0].data = a.placeTop.map(([, v]) => v);
      placeChart.update();

      // 지역 Top 5 (세로 막대) - 시도/시군구 두 줄 표기로 라벨 겹침 방지
      regionChart.data.labels = a.regionTop.map(([k]) => k.split(' '));
      regionChart.data.datasets[0].data = a.regionTop.map(([, v]) => v);
      regionChart.update();
    }

    /* ===================== 드롭다운 ===================== */
    function buildSelect() {
      const select = document.getElementById('crimeSelect');
      select.add(new Option('전체 범죄 (선택 안 함 - 통합 분석)', ALL));

      const groups = {};
      Object.entries(fullCrimeData).forEach(([name, v]) => {
        (groups[v.g] = groups[v.g] || []).push(name);
      });
      Object.entries(groups).forEach(([group, names]) => {
        const og = document.createElement('optgroup');
        og.label = `▣ ${group} (${names.length}개)`;
        names.forEach(n => og.appendChild(new Option(n, n)));
        select.appendChild(og);
      });
      return select;
    }

    /* ===================== 원본 데이터 일괄 다운로드 ===================== */
    function downloadAll() {
      DOWNLOAD_FILES.forEach((path, i) => {
        setTimeout(() => {
          const a = document.createElement('a');
          a.href = encodeURI(path);
          a.download = path.split('/').pop();
          document.body.appendChild(a);
          a.click();
          a.remove();
        }, i * 300);
      });
    }

    /* ===================== 초기화 ===================== */
    document.addEventListener('DOMContentLoaded', () => {
      const select = buildSelect();
      const charts = createCharts();

      const refresh = () => {
        const a = aggregate(select.value);
        renderKpis(a);
        updateCharts(charts, a);
        renderInsight(a);
      };

      select.addEventListener('change', refresh);
      document.getElementById('downloadBtn').addEventListener('click', downloadAll);
      refresh();
    });
  </script>
</body>

</html>
